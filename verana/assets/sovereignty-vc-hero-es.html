<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
  /* Space Grotesk local; IBM Plex Mono web font. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 627px; }

  :root {
    --bg: #0b0b12; --surface: #151824; --surface-2: #1f2331; --rule: #2a2e3d;
    --ink: #ffffff; --muted: #8b94a5;
    --primary: #763ef0; --primary-bright: #8c5bff;
    --green: #29c68c; --blue: #2e6be6;
  }

  .card {
    position: relative; width: 1200px; height: 627px;
    background: var(--bg); overflow: hidden;
    font-family: 'Space Grotesk', sans-serif; color: var(--ink);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(42,46,61,0.5) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(42,46,61,0.5) 1px, transparent 1px);
    background-size: 100px 100px;
  }
  .glow {
    position: absolute; right: -120px; top: -80px;
    width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(118,62,240,0.22) 0%, rgba(41,198,140,0.12) 45%, rgba(11,11,18,0) 70%);
  }

  .content { position: absolute; inset: 0; padding: 60px 72px 50px 72px; display: flex; }

  .left { width: 560px; display: flex; flex-direction: column; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px; font-weight: 500; letter-spacing: 0.2em;
    color: var(--green);
  }
  .headline {
    margin-top: 26px;
    font-size: 56px; font-weight: 700; line-height: 1.08; letter-spacing: -0.02em;
  }
  .headline .hl { color: var(--green); }
  .sub {
    margin-top: 26px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 19px; line-height: 1.7; color: var(--muted);
  }
  .sub .g { color: var(--green); }

  .right { flex: 1; position: relative; }

  .footer {
    position: absolute; left: 72px; right: 72px; bottom: 46px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--rule); padding-top: 22px;
  }
  .brandrow { display: flex; align-items: center; gap: 14px; }
  .brandrow .name { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .url { font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: var(--muted); }

  .gradient-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: linear-gradient(90deg, #763EF0 0%, #1FB57A 100%);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="content">
      <div class="left">
        <div class="eyebrow">IDENTIDAD DIGITAL / CREDENCIALES VERIFICABLES</div>
        <div class="headline">¿Quién controla la <span class="hl">identidad digital</span> de sus ciudadanos?</div>
        <div class="sub">
          sin silos · sin vendor lock-in<br>
          <span class="g">registro soberano · credencial del ciudadano</span>
        </div>
      </div>

      <div class="right">
        <svg width="496" height="420" viewBox="0 0 496 420" xmlns="http://www.w3.org/2000/svg" style="position:absolute; right:-14px; top:6px;">
          <defs>
            <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#763ef0"/>
              <stop offset="1" stop-color="#29c68c"/>
            </linearGradient>
            <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#763ef0"/>
              <stop offset="1" stop-color="#29c68c"/>
            </linearGradient>
            <radialGradient id="nodeglow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="rgba(41,198,140,0.5)"/>
              <stop offset="1" stop-color="rgba(41,198,140,0)"/>
            </radialGradient>
            <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
            </filter>
          </defs>

          <!-- edges credential -> registry -->
          <g stroke="url(#edge)" stroke-width="2" opacity="0.9">
            <line x1="140" y1="248" x2="86" y2="330"/>
            <line x1="248" y1="248" x2="248" y2="338"/>
            <line x1="356" y1="248" x2="410" y2="330"/>
            <line x1="86" y1="330" x2="248" y2="338" opacity="0.5"/>
            <line x1="248" y1="338" x2="410" y2="330" opacity="0.5"/>
          </g>

          <!-- credential card, larger -->
          <g filter="url(#cardshadow)">
            <rect x="78" y="52" width="340" height="196" rx="16" fill="#1f2331" stroke="#29c68c" stroke-width="2"/>
            <path d="M78 68 a16 16 0 0 1 16 -16 h308 a16 16 0 0 1 16 16 v6 h-340 Z" fill="url(#band)"/>
            <text x="98" y="98" fill="#8b94a5" font-family="'IBM Plex Mono', monospace" font-size="14" letter-spacing="1">CREDENCIAL DE IDENTIDAD</text>

            <circle cx="140" cy="162" r="30" fill="#2a2e3d" stroke="#3a3f52"/>
            <circle cx="140" cy="151" r="11" fill="#566071"/>
            <path d="M118 178 a22 14 0 0 1 44 0" fill="#566071"/>

            <rect x="188" y="126" width="150" height="12" rx="6" fill="#8b94a5"/>
            <rect x="188" y="150" width="116" height="12" rx="6" fill="#3a3f52"/>
            <rect x="188" y="174" width="134" height="12" rx="6" fill="#3a3f52"/>
            <text x="98" y="228" fill="#8c5bff" font-family="'IBM Plex Mono', monospace" font-size="15">did:...:ciudadano</text>

            <!-- QR-ish block -->
            <g>
              <rect x="356" y="182" width="40" height="40" rx="3" fill="#2a2e3d"/>
              <rect x="362" y="188" width="10" height="10" fill="#8b94a5"/>
              <rect x="378" y="188" width="10" height="10" fill="#8b94a5"/>
              <rect x="362" y="204" width="10" height="10" fill="#8b94a5"/>
              <rect x="381" y="207" width="7" height="7" fill="#8b94a5"/>
            </g>

            <!-- verified seal -->
            <circle cx="418" cy="76" r="27" fill="#0b0b12" stroke="#29c68c" stroke-width="4"/>
            <path d="M405 76 l9 10 l17 -19" fill="none" stroke="#29c68c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- registry nodes -->
          <g>
            <circle cx="86" cy="330" r="30" fill="url(#nodeglow)"/>
            <circle cx="248" cy="338" r="30" fill="url(#nodeglow)"/>
            <circle cx="410" cy="330" r="30" fill="url(#nodeglow)"/>
          </g>
          <g fill="#0b0b12" stroke="#29c68c" stroke-width="3.5">
            <circle cx="86" cy="330" r="14"/>
            <circle cx="248" cy="338" r="14"/>
            <circle cx="410" cy="330" r="14"/>
          </g>
          <g fill="#29c68c">
            <circle cx="86" cy="330" r="5"/>
            <circle cx="248" cy="338" r="5"/>
            <circle cx="410" cy="330" r="5"/>
          </g>
          <text x="248" y="384" fill="#29c68c" font-family="'IBM Plex Mono', monospace" font-size="16" text-anchor="middle" opacity="0.9">registro público de confianza</text>
        </svg>
      </div>
    </div>

    <div class="footer">
      <div class="brandrow">
        <svg width="38" height="36" viewBox="0 0 54 52" xmlns="http://www.w3.org/2000/svg">
          <path fill="#763EF0" d="M26.9932 51.6972L5.805 11.0977L2.91263 16.2161L0 10.6048L5.98725 0L26.9932 40.2483L47.9993 0L54 10.6217L51.0773 16.2161L48.1849 11.0977L26.9932 51.6972Z"/>
          <path fill="#1FB57A" d="M13.696 0L26.9935 25.4637L39.9367 0H13.696Z"/>
        </svg>
        <span class="name">Verana Foundation</span>
      </div>
      <div class="url">veranafoundation.org</div>
    </div>

    <div class="gradient-bar"></div>
  </div>
</body>
</html>
