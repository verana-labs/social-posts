<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
  /* Space Grotesk is installed locally; IBM Plex Mono comes from the web font above. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 627px; }

  :root {
    --bg: #0b0b12;          /* Ink Black */
    --surface: #151824;     /* Graphite */
    --surface-2: #1f2331;
    --rule: #2a2e3d;
    --ink: #ffffff;
    --muted: #8b94a5;
    --primary: #763ef0;
    --primary-bright: #8c5bff;
    --green: #29c68c;       /* Signal Green */
    --blue: #2e6be6;        /* Electric Blue */
  }

  .card {
    position: relative;
    width: 1200px; height: 627px;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--ink);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(42,46,61,0.5) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(42,46,61,0.5) 1px, transparent 1px);
    background-size: 100px 100px;
  }
  .glow {
    position: absolute; right: -140px; top: -60px;
    width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(41,198,140,0.14) 0%,
      rgba(118,62,240,0.10) 45%,
      rgba(11,11,18,0) 70%);
  }

  .content {
    position: absolute; inset: 0;
    padding: 48px 72px 50px 72px;
    display: flex; flex-direction: column;
  }

  .headline {
    font-size: 40px; font-weight: 700; letter-spacing: -0.015em;
    line-height: 1.1;
  }

  .panels { margin-top: 34px; display: flex; gap: 44px; }
  .panel { width: 506px; }
  .panel-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px; font-weight: 500; letter-spacing: 0.18em;
  }
  .panel-title.grey { color: var(--muted); }
  .panel-title.green { color: var(--green); }
  .panel-box {
    margin-top: 14px;
    height: 250px;
    background: rgba(21,24,36,0.72);
    border: 1px solid var(--rule);
    border-radius: 12px;
    overflow: hidden;
  }
  .caption {
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
  }
  .caption.grey  { color: var(--muted); }
  .caption.green { color: var(--green); }

  .footer {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--rule);
    padding-top: 22px;
  }
  .brandrow { display: flex; align-items: center; gap: 14px; }
  .brandrow .name { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .url { font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: var(--muted); }

  .gradient-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: linear-gradient(90deg, #763EF0 0%, #1FB57A 100%);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="content">
      <div class="headline">¿Quién controla la infraestructura de confianza de su país?</div>

      <div class="panels">
        <!-- LEFT: proprietary silos, isolated, locked -->
        <div class="panel">
          <div class="panel-title grey">PLATAFORMA PROPIETARIA</div>
          <div class="panel-box">
            <svg width="506" height="250" viewBox="0 0 506 250" xmlns="http://www.w3.org/2000/svg">
              <!-- three isolated silos, each in its own dashed enclosure -->
              <!-- silo template: dome + body + lock -->
              <g opacity="0.9">
                <!-- enclosure 1 -->
                <rect x="28" y="38" width="130" height="180" rx="10" fill="none" stroke="#566071" stroke-dasharray="6 6"/>
                <!-- silo 1 -->
                <path d="M58 96 a35 26 0 0 1 70 0 Z" fill="#2a2e3d"/>
                <rect x="58" y="96" width="70" height="96" fill="#1f2331" stroke="#3a3f52"/>
                <line x1="58" y1="120" x2="128" y2="120" stroke="#3a3f52"/>
                <line x1="58" y1="144" x2="128" y2="144" stroke="#3a3f52"/>
                <line x1="58" y1="168" x2="128" y2="168" stroke="#3a3f52"/>
                <!-- lock -->
                <rect x="82" y="132" width="24" height="19" rx="3" fill="#566071"/>
                <path d="M87 132 v-7 a7 7 0 0 1 14 0 v7" fill="none" stroke="#566071" stroke-width="3.5"/>
              </g>
              <g opacity="0.9">
                <!-- enclosure 2 -->
                <rect x="188" y="20" width="130" height="198" rx="10" fill="none" stroke="#566071" stroke-dasharray="6 6"/>
                <path d="M218 80 a35 26 0 0 1 70 0 Z" fill="#2a2e3d"/>
                <rect x="218" y="80" width="70" height="112" fill="#1f2331" stroke="#3a3f52"/>
                <line x1="218" y1="108" x2="288" y2="108" stroke="#3a3f52"/>
                <line x1="218" y1="136" x2="288" y2="136" stroke="#3a3f52"/>
                <line x1="218" y1="164" x2="288" y2="164" stroke="#3a3f52"/>
                <rect x="242" y="124" width="24" height="19" rx="3" fill="#566071"/>
                <path d="M247 124 v-7 a7 7 0 0 1 14 0 v7" fill="none" stroke="#566071" stroke-width="3.5"/>
              </g>
              <g opacity="0.9">
                <!-- enclosure 3 -->
                <rect x="348" y="38" width="130" height="180" rx="10" fill="none" stroke="#566071" stroke-dasharray="6 6"/>
                <path d="M378 96 a35 26 0 0 1 70 0 Z" fill="#2a2e3d"/>
                <rect x="378" y="96" width="70" height="96" fill="#1f2331" stroke="#3a3f52"/>
                <line x1="378" y1="120" x2="448" y2="120" stroke="#3a3f52"/>
                <line x1="378" y1="144" x2="448" y2="144" stroke="#3a3f52"/>
                <line x1="378" y1="168" x2="448" y2="168" stroke="#3a3f52"/>
                <rect x="402" y="132" width="24" height="19" rx="3" fill="#566071"/>
                <path d="M407 132 v-7 a7 7 0 0 1 14 0 v7" fill="none" stroke="#566071" stroke-width="3.5"/>
              </g>
              <!-- broken connections between enclosures -->
              <g stroke="#566071" stroke-width="2">
                <line x1="160" y1="128" x2="172" y2="128"/>
                <line x1="176" y1="128" x2="186" y2="128" opacity="0.35"/>
                <line x1="320" y1="128" x2="332" y2="128"/>
                <line x1="336" y1="128" x2="346" y2="128" opacity="0.35"/>
              </g>
              <g fill="#566071" font-family="'IBM Plex Mono', monospace" font-size="15" text-anchor="middle">
                <text x="253" y="240">datos encerrados · sin interoperabilidad</text>
              </g>
            </svg>
          </div>
          <div class="caption grey">la controla el proveedor</div>
        </div>

        <!-- RIGHT: one open trust graph, no center -->
        <div class="panel">
          <div class="panel-title green">CAPA DE CONFIANZA ABIERTA</div>
          <div class="panel-box">
            <svg width="506" height="250" viewBox="0 0 506 250" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#763ef0"/>
                  <stop offset="1" stop-color="#29c68c"/>
                </linearGradient>
                <radialGradient id="nodeglow" cx="0.5" cy="0.5" r="0.5">
                  <stop offset="0" stop-color="rgba(41,198,140,0.55)"/>
                  <stop offset="1" stop-color="rgba(41,198,140,0)"/>
                </radialGradient>
              </defs>
              <!-- mesh edges: every node connected, no hub -->
              <g stroke="url(#edge)" stroke-width="1.8" opacity="0.85">
                <line x1="90" y1="70" x2="240" y2="46"/>
                <line x1="240" y1="46" x2="400" y2="76"/>
                <line x1="90" y1="70" x2="150" y2="176"/>
                <line x1="240" y1="46" x2="150" y2="176"/>
                <line x1="240" y1="46" x2="320" y2="160"/>
                <line x1="400" y1="76" x2="320" y2="160"/>
                <line x1="150" y1="176" x2="320" y2="160"/>
                <line x1="150" y1="176" x2="253" y2="222"/>
                <line x1="320" y1="160" x2="253" y2="222"/>
                <line x1="90" y1="70" x2="320" y2="160" opacity="0.4"/>
                <line x1="400" y1="76" x2="253" y2="222" opacity="0.4"/>
              </g>
              <!-- node glows -->
              <g>
                <circle cx="90" cy="70" r="34" fill="url(#nodeglow)"/>
                <circle cx="240" cy="46" r="34" fill="url(#nodeglow)"/>
                <circle cx="400" cy="76" r="34" fill="url(#nodeglow)"/>
                <circle cx="150" cy="176" r="34" fill="url(#nodeglow)"/>
                <circle cx="320" cy="160" r="34" fill="url(#nodeglow)"/>
                <circle cx="253" cy="222" r="30" fill="url(#nodeglow)"/>
              </g>
              <!-- nodes: rings, open (not filled boxes) -->
              <g fill="#0b0b12" stroke="#29c68c" stroke-width="3">
                <circle cx="90" cy="70" r="15"/>
                <circle cx="240" cy="46" r="15"/>
                <circle cx="400" cy="76" r="15"/>
                <circle cx="150" cy="176" r="15"/>
                <circle cx="320" cy="160" r="15"/>
                <circle cx="253" cy="222" r="12"/>
              </g>
              <g fill="#29c68c">
                <circle cx="90" cy="70" r="5"/>
                <circle cx="240" cy="46" r="5"/>
                <circle cx="400" cy="76" r="5"/>
                <circle cx="150" cy="176" r="5"/>
                <circle cx="320" cy="160" r="5"/>
                <circle cx="253" cy="222" r="4"/>
              </g>
              <g fill="#29c68c" font-family="'IBM Plex Mono', monospace" font-size="15" text-anchor="middle" opacity="0.9">
                <text x="253" y="248">interoperable · sin dueño · verificable</text>
              </g>
            </svg>
          </div>
          <div class="caption green">la controla usted</div>
        </div>
      </div>

      <div class="footer">
        <div class="brandrow">
          <svg width="38" height="36" viewBox="0 0 54 52" xmlns="http://www.w3.org/2000/svg">
            <path fill="#763EF0" d="M26.9932 51.6972L5.805 11.0977L2.91263 16.2161L0 10.6048L5.98725 0L26.9932 40.2483L47.9993 0L54 10.6217L51.0773 16.2161L48.1849 11.0977L26.9932 51.6972Z"/>
            <path fill="#1FB57A" d="M13.696 0L26.9935 25.4637L39.9367 0H13.696Z"/>
          </svg>
          <span class="name">Verana Foundation</span>
        </div>
        <div class="url">veranafoundation.org</div>
      </div>
    </div>

    <div class="gradient-bar"></div>
  </div>
</body>
</html>
